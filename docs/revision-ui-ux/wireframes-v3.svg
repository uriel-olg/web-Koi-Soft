<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2220" viewBox="0 0 1800 2220" role="img" aria-labelledby="title desc"><title id="title">KoiBite: wireframes de escritorio y móvil</title><desc id="desc">Recorrido completo con navegación, hero, servicios, propuestas, forma de trabajo, proceso, FAQ, CTA y footer.</desc><style>svg{font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1800" height="2220" rx="0" fill="#ECEDE9"/><text x="56" y="50" font-size="13" fill="#52616B" font-weight="600" letter-spacing="1.4">KOIBITE / WIREFRAMES V3 / RECORRIDO COMPLETO</text><text x="56" y="105" font-size="36" fill="#182530" font-family="Georgia, serif" font-weight="400" letter-spacing="-1.5">Primero entender. Después explorar. Por último, consultar.</text><text x="56" y="143" font-size="16" fill="#52616B" >Bloques esquemáticos: sus alturas se adaptan al contenido. No representan medidas finales de implementación.</text><text x="56" y="187" font-size="12" fill="#52616B" font-weight="600" letter-spacing="1.4">ESCRITORIO / 1440 PX</text><text x="1260" y="187" font-size="12" fill="#52616B" font-weight="600" letter-spacing="1.4">MÓVIL / 390 PX</text><g transform="translate(56 210) scale(0.78)"><rect x="0" y="0" width="1440" height="2320" rx="18" fill="#F7F8F5" stroke="#A9B0AC"/><rect x="40" y="24" width="1360" height="72" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="59" font-size="20" fill="#182530" font-weight="600">KOIBITE       Inicio / Servicios / Proyectos / Nosotros</text><text x="62" y="89" font-size="15" fill="#52616B" >CTA: Contanos qué necesitás → /contacto</text><rect x="40" y="125" width="1360" height="250" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="160" font-size="20" fill="#182530" font-weight="600">HERO CENTRADO · H1 + BAJADA</text><text x="62" y="190" font-size="15" fill="#52616B" >Oferta explícita; CTA a Contacto y enlace a Proyectos</text><rect x="80" y="420" width="270" height="240" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="102" y="455" font-size="20" fill="#182530" font-weight="600">APOYO IT</text><text x="102" y="485" font-size="15" fill="#52616B" >Decorativo; enlaza al caso</text><rect x="376" y="400" width="688" height="280" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="398" y="435" font-size="20" fill="#182530" font-weight="600">INTERFAZ PRINCIPAL 4:3</text><text x="398" y="465" font-size="15" fill="#52616B" >Concepto o captura real, identificado</text><rect x="1090" y="420" width="270" height="240" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="1112" y="455" font-size="20" fill="#182530" font-weight="600">APOYO EDITORIAL</text><text x="1112" y="485" font-size="15" fill="#52616B" >Sin información exclusiva</text><rect x="40" y="720" width="430" height="220" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="755" font-size="20" fill="#182530" font-weight="600">SERVICIOS</text><text x="62" y="785" font-size="15" fill="#52616B" >Introducción: dos áreas</text><rect x="500" y="720" width="900" height="100" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="522" y="755" font-size="20" fill="#182530" font-weight="600">01 DESARROLLO WEB</text><text x="522" y="785" font-size="15" fill="#52616B" >Descripción + /servicios#digital</text><rect x="500" y="840" width="900" height="100" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="522" y="875" font-size="20" fill="#182530" font-weight="600">02 SOPORTE IT</text><text x="522" y="905" font-size="15" fill="#52616B" >Descripción + /servicios#it</text><rect x="40" y="980" width="790" height="290" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="1015" font-size="20" fill="#182530" font-weight="600">PROPUESTA DESTACADA · 7 COLUMNAS</text><text x="62" y="1045" font-size="15" fill="#52616B" >Captura + problema + solución + enlace</text><rect x="854" y="980" width="546" height="290" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="876" y="1015" font-size="20" fill="#182530" font-weight="600">SEGUNDO CASO · 5 COLUMNAS</text><text x="876" y="1045" font-size="15" fill="#52616B" >Tipo de caso visible</text><rect x="40" y="1310" width="1360" height="180" rx="12" fill="#E3E9E0" stroke="#A9B0AC"/><text x="62" y="1345" font-size="20" fill="#182530" font-weight="600">FORMA DE TRABAJAR · BANDA SALVIA</text><text x="62" y="1375" font-size="15" fill="#52616B" >Claridad / alcance / continuidad · enlace a Nosotros</text><rect x="40" y="1530" width="1360" height="190" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="1565" font-size="20" fill="#182530" font-weight="600">PROCESO · 4 COLUMNAS</text><text x="62" y="1595" font-size="15" fill="#52616B" >01 Escuchamos → 02 Definimos → 03 Hacemos → 04 Acompañamos</text><rect x="40" y="1760" width="470" height="210" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="1795" font-size="20" fill="#182530" font-weight="600">FAQ · TÍTULO</text><text x="62" y="1825" font-size="15" fill="#52616B" >Hacer otra consulta</text><rect x="534" y="1760" width="866" height="210" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="556" y="1795" font-size="20" fill="#182530" font-weight="600">FAQ · ACORDEONES</text><text x="556" y="1825" font-size="15" fill="#52616B" >Alcance, presupuesto, soporte, mantenimiento</text><rect x="40" y="2010" width="1360" height="160" rx="12" fill="#D8DEDD" stroke="#A9B0AC"/><text x="62" y="2045" font-size="20" fill="#182530" font-weight="600">CTA FINAL</text><text x="62" y="2075" font-size="15" fill="#52616B" >¿Qué necesitás resolver? → Contacto</text><rect x="40" y="2210" width="1360" height="80" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="62" y="2245" font-size="20" fill="#182530" font-weight="600">FOOTER: MARCA / NAVEGACIÓN / CONTACTO REAL</text></g><g transform="translate(1260 210) scale(0.9)"><rect x="0" y="0" width="390" height="2150" rx="18" fill="#F7F8F5" stroke="#A9B0AC"/><rect x="16" y="16" width="358" height="70" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="51" font-size="20" fill="#182530" font-weight="600">KOIBITE                      ☰</text><rect x="16" y="110" width="358" height="250" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="145" font-size="20" fill="#182530" font-weight="600">HERO · LECTURA CENTRADA</text><text x="38" y="175" font-size="15" fill="#52616B" >H1, bajada, CTA y enlace</text><rect x="16" y="386" width="358" height="236" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="421" font-size="20" fill="#182530" font-weight="600">INTERFAZ PRINCIPAL</text><text x="38" y="451" font-size="15" fill="#52616B" >4:3, etiqueta + enlace</text><rect x="16" y="650" width="358" height="210" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="685" font-size="20" fill="#182530" font-weight="600">SERVICIOS APILADOS</text><text x="38" y="715" font-size="15" fill="#52616B" >Desarrollo web / Soporte IT</text><rect x="16" y="888" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="923" font-size="20" fill="#182530" font-weight="600">PROPUESTA DESTACADA</text><text x="38" y="953" font-size="15" fill="#52616B" >Imagen, contexto y enlace</text><rect x="16" y="1090" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="1125" font-size="20" fill="#182530" font-weight="600">SEGUNDA PROPUESTA</text><text x="38" y="1155" font-size="15" fill="#52616B" >Mismo orden semántico</text><rect x="16" y="1298" width="358" height="140" rx="12" fill="#E3E9E0" stroke="#A9B0AC"/><text x="38" y="1333" font-size="20" fill="#182530" font-weight="600">FORMA DE TRABAJAR</text><text x="38" y="1363" font-size="15" fill="#52616B" >Banda salvia</text><rect x="16" y="1466" width="358" height="170" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="1501" font-size="20" fill="#182530" font-weight="600">PROCESO VERTICAL</text><text x="38" y="1531" font-size="15" fill="#52616B" >4 pasos; sin carrusel</text><rect x="16" y="1664" width="358" height="170" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="1699" font-size="20" fill="#182530" font-weight="600">FAQ</text><text x="38" y="1729" font-size="15" fill="#52616B" >Acordeones accesibles</text><rect x="16" y="1862" width="358" height="130" rx="12" fill="#D8DEDD" stroke="#A9B0AC"/><text x="38" y="1897" font-size="20" fill="#182530" font-weight="600">CTA FINAL</text><text x="38" y="1927" font-size="15" fill="#52616B" >Contanos qué necesitás</text><rect x="16" y="2020" width="358" height="100" rx="12" fill="#FFFFFF" stroke="#A9B0AC"/><text x="38" y="2055" font-size="20" fill="#182530" font-weight="600">FOOTER</text><text x="38" y="2085" font-size="15" fill="#52616B" >Enlaces y contacto</text></g><text x="56" y="2110" font-size="16" fill="#52616B" >Los apoyos laterales del hero se omiten en móvil; sus contenidos relevantes siguen en Servicios y Proyectos.</text><text x="56" y="2142" font-size="16" fill="#52616B" >Navegación entre páginas: / · /servicios · /proyectos · /nosotros · /contacto. Proceso en Inicio.</text><text x="56" y="2180" font-size="13" fill="#52616B" >Importar SVG permite editar vectores; Auto Layout, variables y estados se construyen en Figma según la guía.</text></svg>