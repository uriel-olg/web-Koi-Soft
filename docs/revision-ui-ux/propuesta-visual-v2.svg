    <text x="1096" y="68" fill="#14131B" class="small" font-weight="600">Solicitar presupuesto</text>
    <text x="1310" y="68" fill="#14131B" font-size="20">↗</text>
    <text x="80" y="188" class="orange label">DESARROLLO WEB + SOPORTE IT</text>
    <text x="80" y="270" class="copy" font-size="64" font-weight="600" letter-spacing="-1.8">Desarrollo web</text>
    <text x="80" y="340" class="copy" font-size="64" font-weight="600" letter-spacing="-1.8">y soporte IT para</text>
    <text x="80" y="410" class="orange" font-size="64" font-weight="600" letter-spacing="-1.8">tu negocio.</text>
    <text x="80" y="464" class="muted body">Creamos tu presencia online y resolvemos los</text>
    <text x="80" y="493" class="muted body">problemas técnicos que frenan tu trabajo.</text>
