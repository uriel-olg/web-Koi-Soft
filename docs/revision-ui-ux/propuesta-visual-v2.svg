    <text x="20" y="205" class="copy" font-size="40" font-weight="600" letter-spacing="-1.2">Desarrollo web</text>
    <text x="20" y="249" class="copy" font-size="40" font-weight="600" letter-spacing="-1.2">y soporte IT para</text>
    <text x="20" y="293" class="orange" font-size="40" font-weight="600" letter-spacing="-1.2">tu negocio.</text>
    <text x="20" y="335" class="muted" font-size="17">Creamos tu presencia online y</text>
