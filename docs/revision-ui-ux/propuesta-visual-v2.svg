      <text x="28" y="90" class="muted" font-size="16">Diagnóstico, configuración y mantenimiento</text>
      <text x="28" y="116" class="muted" font-size="16">para los equipos que usás todos los días.</text>
      <text x="28" y="177" class="orange" font-size="15" font-weight="600">Consultar por soporte →</text>
    </g>
    <text x="80" y="1070" class="copy" font-size="38" font-weight="600">El trabajo, en concreto.</text>
    <text x="80" y="1103" class="muted" font-size="16">Capturas, contexto y alcance. Cada concepto identificado como tal.</text>
    <g transform="translate(80 1140)">
      <rect width="628" height="200" rx="20" class="panel"/>
      <rect x="20" y="20" width="248" height="160" rx="12" fill="#20324A"/>
      <path d="M44 52 H243 M44 78 H165 M44 98 H210" stroke="#71839C" stroke-width="6" stroke-linecap="round"/>
