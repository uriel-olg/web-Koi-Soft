      <text x="292" y="98" class="copy" font-size="23" font-weight="600">Captura + contexto</text>
      <text x="292" y="128" class="muted small">Problema y solución entregada.</text>
      <text x="292" y="162" fill="#7DB3FF" font-size="15">Ver caso →</text>
    </g>
    <g transform="translate(732 1140)">
      <rect width="628" height="200" rx="20" class="panel"/>
      <rect x="20" y="20" width="248" height="160" rx="12" fill="#E8E5DC"/>
      <rect x="44" y="44" width="200" height="18" rx="4" fill="#A8AEB6"/>
      <rect x="44" y="80" width="90" height="76" rx="8" fill="#FA713A"/>
      <rect x="146" y="80" width="98" height="76" rx="8" fill="#CFD4D8"/>
      <text x="292" y="59" class="orange label">CONCEPTO / EJEMPLO</text>
      <text x="292" y="98" class="copy" font-size="23" font-weight="600">Una idea demostrable</text>
      <text x="292" y="128" class="muted small">Mostrar alcance, sin resultados ficticios.</text>
      <text x="292" y="162" fill="#7DB3FF" font-size="15">Explorar concepto →</text>
    </g>
