  <text x="56" y="1338" fill="#536176" font-size="15">La continuación completa —beneficios, proceso, FAQ y cierre— se detalla en el wireframe. No se recorta contenido en la implementación.</text>
  <g transform="translate(56 1375)">
    <rect width="1108" height="138" rx="18" fill="#E8E5DC"/>
    <text x="24" y="34" fill="#536176" font-size="12" font-weight="600" letter-spacing="1.2">PANEL DE BENEFICIOS / UN DESCANSO VISUAL</text>
    <text x="24" y="76" fill="#152136" font-size="24" font-weight="600">Alcance definido.</text>
    <text x="383" y="76" fill="#152136" font-size="24" font-weight="600">Comunicación clara.</text>
    <text x="768" y="76" fill="#152136" font-size="24" font-weight="600">Continuidad.</text>
    <text x="24" y="109" fill="#536176" font-size="15">Sin repetir servicios: explicar cómo se trabaja y qué puede esperar el cliente.</text>
