<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1580" viewBox="0 0 1800 1580" role="img" aria-labelledby="title desc">
  <title id="title">KoiBite: propuesta visual de escritorio y móvil</title>
  <desc id="desc">Diseño para revisión en azul noche y naranja. Hero explícito, dos áreas de servicio y trabajos destacados. Las interfaces mostradas son ilustrativas. No representa una web implementada.</desc>
  <defs>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#172C48"/><stop offset="1" stop-color="#101A2B"/></linearGradient>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; }
      .copy { fill: #F3F5FA; } .muted { fill: #A1AEC3; } .orange { fill: #FA713A; }
      .label { font-size:12px; font-weight:600; letter-spacing:1.4px; }
      .body { font-size:18px; } .small { font-size:14px; }
      .panel { fill:#101A2B; stroke:#293850; }
    </style>
  </defs>
  <rect width="1800" height="1580" fill="#F1F2F4"/>
  <text x="56" y="52" fill="#536176" font-size="13" font-weight="600" letter-spacing="2">KOIBITE / DIRECCIÓN VISUAL / 22 OCT 2026</text>
  <text x="56" y="107" fill="#152136" font-size="40" font-weight="600">Servicios claros. Trabajos visibles. Una consulta simple.</text>
  <text x="56" y="144" fill="#536176" font-size="18">Propuesta estática para aprobar · identidad actual simplificada · visuales ilustrativos · tipografía de sistema</text>
  <text x="56" y="196" fill="#536176" font-size="13" font-weight="600">ESCRITORIO · COMPOSICIÓN A 1440 PX, ESCALADA PARA ESTA LÁMINA</text>
  <text x="1230" y="196" fill="#536176" font-size="13" font-weight="600">MÓVIL · 390 PX</text>
  <g transform="translate(56 218) scale(.77)">
    <rect width="1440" height="1400" rx="24" fill="#080F1E"/>
    <rect x="80" y="28" width="1280" height="68" rx="16" fill="#0C1627" stroke="#293850"/>
    <circle cx="117" cy="62" r="13" fill="none" stroke="#FA713A" stroke-width="4"/>
    <path d="M108 57 Q132 65 112 74" fill="none" stroke="#F3F5FA" stroke-width="3"/>
